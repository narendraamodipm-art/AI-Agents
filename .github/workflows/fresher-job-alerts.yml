name: Fresher job alerts (daily 10 AM IST)

on:
  schedule:
    # 04:00 UTC = 9:30 AM IST. Scheduled runs can start late, so the job starts early,
    # finds jobs, then waits until 10:00 IST before posting (run.py --wait).
    - cron: "0 4 * * *"
  workflow_dispatch: # manual run from the Actions tab (posts immediately)

permissions:
  contents: write # commits FRESHER_JOB_HUNT/data/ so posted jobs are remembered between runs

concurrency:
  group: fresher-job-alerts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: FRESHER_JOB_HUNT/agent/requirements.txt

      - run: pip install -r FRESHER_JOB_HUNT/agent/requirements.txt

      - name: Find jobs and post
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          SITE_URL: ${{ secrets.FRESHER_SITE_URL }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python FRESHER_JOB_HUNT/agent/run.py --wait
          else
            python FRESHER_JOB_HUNT/agent/run.py
          fi

      # Runs even if posting failed part-way, so jobs already posted aren't posted again tomorrow.
      - name: Save posted jobs to the repo
        if: success() || failure()
        run: |
          git add FRESHER_JOB_HUNT/data
          if git diff --cached --quiet; then
            echo "Nothing new to save"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fresher Job Hunt: daily post data"
          git pull --rebase origin main
          git push origin HEAD:main
