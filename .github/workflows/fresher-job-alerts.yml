name: Fresher job alerts (daily 10 AM IST)

on:
  schedule:
    # 04:00 UTC = 9:30 AM IST. Scheduled runs can start late, so the job starts early,
    # finds jobs, then waits until 10:00 IST before posting (run.py --wait).
    - cron: "0 4 * * *"
  workflow_dispatch: # manual run from the Actions tab (posts immediately)

permissions:
  contents: read

concurrency:
  group: fresher-job-alerts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: FRESHER_JOB_HUNT/agent/requirements.txt

      - run: pip install -r FRESHER_JOB_HUNT/agent/requirements.txt

      - name: Find jobs and post
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_PAID_CHANNEL_ID: ${{ secrets.TELEGRAM_PAID_CHANNEL_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: ${{ secrets.FRESHER_SITE_URL }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python FRESHER_JOB_HUNT/agent/run.py --wait
          else
            python FRESHER_JOB_HUNT/agent/run.py
          fi
