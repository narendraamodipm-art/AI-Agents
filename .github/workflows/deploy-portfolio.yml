name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "MY_PORTFOLIO/**"
      - "AI WORKFLOW/delusion_calculator/**"
      - ".github/workflows/deploy-portfolio.yml"
  workflow_dispatch: # allows a manual deploy from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel one that is already running
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Portfolio at the site root, the delusion calculator at /delusion/
      # (front-end files only: server.js and api/ need a server and are not published)
      - name: Assemble site
        run: |
          mkdir -p _site/delusion
          cp -r MY_PORTFOLIO/. _site/
          cd "AI WORKFLOW/delusion_calculator"
          cp index.html style.css app.js ../../_site/delusion/
          cp -r memes ../../_site/delusion/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
