name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "MY_PORTFOLIO/**"
      - ".github/workflows/deploy-portfolio.yml"
  workflow_dispatch: # allows a manual deploy from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel one that is already running
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: MY_PORTFOLIO

      - id: deployment
        uses: actions/deploy-pages@v4
